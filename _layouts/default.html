<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    {% seo %}
  </head>
  <body class="bg-gray-50 min-h-screen">
    <a href="https://github.com/columbusrb/columbusrb.github.io" target="_blank"
      class="fixed z-50 top-12 right-[-4rem] rotate-45 bg-red-700 text-white px-20 py-2 shadow-lg text-sm font-bold tracking-wide hover:bg-red-800 transition-colors pointer-events-auto"
      title="Fork me on GitHub">
      Fork me on GitHub
    </a>

    {%- include header.html -%}

    <main class="container mx-auto px-4 py-8 max-w-4xl">
      {{ content }}
    </main>

    {%- include footer.html -%}
  </body>
</html>
